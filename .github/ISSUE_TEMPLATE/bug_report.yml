name: Bug report
description: Something rust-anything did wrong, or a port it got wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A security problem goes through the private report in SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The commands, and a minimal project if you can (a few files is ideal).
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full error or the relevant part of the output.
      render: text
  - type: input
    id: version
    attributes:
      label: rust-anything version
      description: Output of `rust-anything --version`.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language being ported
      options:
        - TypeScript/JavaScript
        - Python
        - C
        - Go
        - Ruby
        - Java
        - PHP
        - C#
        - Not language specific
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture, plus the runtime version if it matters (Node, Python, JDK...).
      placeholder: macOS 26 arm64, Node 22
    validations:
      required: true
