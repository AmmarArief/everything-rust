[package]
name = "textkit-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `lib/textkit/`, generated by carcinize"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
