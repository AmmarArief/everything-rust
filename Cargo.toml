[package]
name = "carcinize"
version = "0.1.0"
edition = "2024"
description = "Plan, bridge, verify and ship incremental migrations of TypeScript/JavaScript code to Rust"
license = "MIT"
readme = "README.md"
rust-version = "1.88"
keywords = ["migration", "typescript", "napi", "wasm", "rewrite"]
categories = ["command-line-utilities", "development-tools", "wasm"]
# repository and homepage: set once the project has a name and a home.
exclude = ["demo/", "docs/examples/", "tests/fixtures/**/node_modules"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
json5 = "0.4"
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_ast_visit = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"
oxc_syntax = "0.158"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
