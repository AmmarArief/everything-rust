[package]
name = "carcinize"
version = "0.1.0"
edition = "2024"
description = "Plan, bridge, verify and ship incremental migrations of TypeScript/JavaScript code to Rust"
license = "MIT"
readme = "README.md"
rust-version = "1.88"
keywords = ["migration", "typescript", "napi", "wasm", "rewrite"]
categories = ["command-line-utilities", "development-tools", "wasm"]
# repository and homepage: set once the project has a name and a home.
exclude = ["demo/", "docs/examples/", "tests/fixtures/**/node_modules"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
json5 = "0.4"
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_ast_visit = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"
oxc_syntax = "0.158"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: recorded floats must survive parsing bit for bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml_edit = "0.22"
tree-sitter = "0.26.13"
tree-sitter-c = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
